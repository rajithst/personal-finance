<mat-card appearance="outlined">
  <mat-card-header>
    <div class="d-flex-align-sb card-title">
      <div class="title">
        <mat-card-title>Category settings</mat-card-title>
      </div>
      <div class="actions">
        <button mat-raised-button color="primary" (click)="editCategory()">
          Add New Category
        </button>
      </div>
    </div>
  </mat-card-header>
  <mat-card-content>
    <mat-accordion class="transaction-item-panel" multi="true">
      @for (data of categorySettings; track data; let i = $index) {
        <mat-expansion-panel class="transaction-panel">
          <mat-expansion-panel-header>
            <mat-panel-title>{{ data.category.category }}</mat-panel-title>

            <mat-panel-description>
              <button
                mat-icon-button
                (click)="editCategory(data)"
                aria-label="Edit payee"
              >
                <mat-icon>edit</mat-icon>
              </button>
              <button
                mat-icon-button
                (click)="deleteCategory(data)"
                aria-label="Delete category"
              >
                <mat-icon>delete</mat-icon>
              </button>
            </mat-panel-description>
          </mat-expansion-panel-header>
          <table mat-table [dataSource]="data.subCategories!">
            <ng-container matColumnDef="name">
              <th mat-header-cell *matHeaderCellDef>Sub Category</th>
              <td mat-cell *matCellDef="let element">{{ element.name }}</td>
            </ng-container>
            <ng-container matColumnDef="description">
              <th mat-header-cell *matHeaderCellDef>Description</th>
              <td mat-cell *matCellDef="let element">
                {{ element.description }}
              </td>
            </ng-container>
            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
          </table>
        </mat-expansion-panel>
      }
    </mat-accordion>
  </mat-card-content>
</mat-card>
