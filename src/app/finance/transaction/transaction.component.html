<div class="main-toolbar">
  <nav mat-tab-nav-bar mat-stretch-tabs="false" [tabPanel]="tabPanel">
    @for (link of tabs; track link) {
      <a
        mat-tab-link
        [routerLink]="link.route"
        (click)="activeLink = link"
        [active]="activeLink == link"
      >
        {{ link.label }}
      </a>
    }
  </nav>
  <div class="toolbar-actions">
    <button mat-flat-button color="primary" [matMenuTriggerFor]="menu">
      {{dataService.getFilterYear()}}
    </button>
    <mat-menu #menu="matMenu">
      @for (year of financeYears; track year) {
        <button mat-menu-item (click)="onYearSelect(year)">{{ year }}</button>
      }
    </mat-menu>
  </div>
</div>
<mat-tab-nav-panel #tabPanel>
  <router-outlet></router-outlet>
</mat-tab-nav-panel>
